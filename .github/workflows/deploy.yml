name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP: northernacs
  ROOT: /var/www/northernacs
  VPS_HOST: root@178.105.69.252

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Create release directory on VPS
        run: |
          RELEASE="${{ env.ROOT }}/releases/$(date +%F-%H%M%S)-${{ github.sha }}"
          ssh -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            ${{ env.VPS_HOST }} "mkdir -p '$RELEASE'"
          echo "RELEASE_DIR=$RELEASE" >> "$GITHUB_ENV"

      - name: Copy build to VPS
        run: |
          rsync -e "ssh -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=4" \
            -az --delete \
            dist/ \
            ${{ env.VPS_HOST }}:"${{ env.RELEASE_DIR }}/"

      - name: Activate release
        run: |
          PREV=$(ssh -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            ${{ env.VPS_HOST }} "readlink \"${{ env.ROOT }}/current\" 2>/dev/null || echo ''")
          ssh -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            ${{ env.VPS_HOST }} "ln -sfn '${{ env.RELEASE_DIR }}' '${{ env.ROOT }}/current'"
          echo "PREV=$PREV" >> "$GITHUB_ENV"

      - name: Clean old releases (keep last 5)
        run: |
          ssh -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            ${{ env.VPS_HOST }} \
            "ls -1dt '${{ env.ROOT }}/releases'/* 2>/dev/null | tail -n +6 | xargs -r rm -rf"

      - name: Reload nginx
        run: |
          ssh -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            ${{ env.VPS_HOST }} "nginx -t && systemctl reload nginx"

      - name: Smoke test
        run: |
          set -e
          code=$(curl -sk -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 10 "https://northernacs.com/")
          echo "https://northernacs.com/ -> $code"
          [ "$code" = "200" ] || { echo "Smoke test FAILED for northernacs.com"; exit 1; }