name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy dist/ to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -T -o LogLevel=ERROR" \
            dist/ root@178.105.69.252:/var/www/northernacs.com/

      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
              root@178.105.69.252 "nginx -t && systemctl reload nginx"

      - name: Smoke test
        run: |
          set -e
          code=$(curl -sk -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 10 "https://northernacs.com/")
          echo "https://northernacs.com/ -> $code"
          [ "$code" = "200" ] || { echo "Smoke test FAILED for northernacs.com"; exit 1; }
