server {
    listen 80;
    listen [::]:80;
    server_name dev.northernacs.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.northernacs.com;

    ssl_certificate     /etc/letsencrypt/live/dev.northernacs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.northernacs.com/privkey.pem;

    root /var/www/northernacs-dev/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
