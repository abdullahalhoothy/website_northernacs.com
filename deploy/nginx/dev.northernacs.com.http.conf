server {
    listen 80;
    listen [::]:80;
    server_name dev.northernacs.com;

    root /var/www/northernacs-dev/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
